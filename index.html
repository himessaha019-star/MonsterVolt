<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterVolt Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            object-fit: contain;
            outline: none;
        }
    </style>
</head>
<body>

    <video id="myPlayer" controls playsinline autoplay muted></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');
        const player = document.getElementById('myPlayer');

        if (fileId) {
            // Corsproxy dynamic stream url
            const streamUrl = `https://corsproxy.io/?url=${encodeURIComponent('https://pixeldrain.net/api/file/' + fileId)}`;
            
            player.src = streamUrl;

            // Direct API Fallback if Proxy faces delay
            player.onerror = function() {
                console.log("Proxy failed, falling back to direct download link...");
                player.src = `https://pixeldrain.net/api/file/${fileId}?download`;
            };
        }
    </script>

</body>
</html>
