<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterVolt Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        video {
            width: 100%;
            max-width: 900px;
            max-height: 100vh;
            outline: none;
        }
    </style>
</head>
<body>

    <video id="myPlayer" controls playsinline controlsList="nodownload"></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');
        const player = document.getElementById('myPlayer');

        if (fileId) {
            player.src = `https://pixeldrain.net/api/file/${fileId}`;
        }
    </script>

</body>
</html>
