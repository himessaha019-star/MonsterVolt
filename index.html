<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonsterVolt Player</title>
</head>
<body style="background-color: #000;">

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        if (fileId) {
            // Instantly redirect to Pixeldrain official video stream page
            window.location.replace(`https://pixeldrain.net/u/${fileId}`);
        }
    </script>

</body>
</html>
