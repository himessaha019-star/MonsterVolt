<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MonsterVolt Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .player-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }

    @media screen and (orientation: landscape) and (max-height: 500px) {
      body {
        padding: 0;
      }
      .player-container {
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        border-radius: 0;
        border: none;
        aspect-ratio: unset;
      }
    }
  </style>
</head>
<body>

  <div class="player-container" id="playerBox">
    <video id="myVideo" controls controlsList="nodownload" playsinline preload="metadata">
      <source src="https://pixeldrain.net/api/file/YepmPoTo" type="video/mp4">
      আপনার ব্রাউজার ভিডিও ট্যাগ সাপোর্ট করছে না।
    </video>
  </div>

  <script>
    const video = document.getElementById('myVideo');

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      } else {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    });
  </script>

</body>
</html>
